const map = new maplibregl.Map({

map.addControl(new maplibregl.AttributionControl({compact: true}));
// The compact attribution control auto-expands itself the first time actual
// attribution text is set (once tiles load), regardless of the compact
// option - this forces it back closed the first time that happens, so it
// stays collapsed to just the (i) icon by default. Only observes once,
// so a user's own later clicks to open it aren't fought.
const attribObserver = new MutationObserver(() => {

  if (attrib && attrib.hasAttribute('open')){

const attribEl = document.querySelector('.maplibregl-ctrl-attrib');
if (attribEl) attribObserver.observe(attribEl, {attributes: true, attributeFilter: ['open']});

function pinElement(ev){
  const color = ev.sponsored ? '#F0A430' : catColor[ev.cat];
  const dot = document.createElement('div');
  dot.className = 'pin' + (ev.sponsored ? ' sponsored' : '');
  dot.style.background = color;
  return dot;
}

// Saying "free" on a site called Freebies Near Me is always redundant, so
// it's stripped from the offer description wherever it's shown rather than
// relying on every submitter to leave it out themselves. Exception: "Free
// Flicks" is a proper name (the actual title of the screening series), not
// filler, so it's left alone via a negative lookahead.
function stripFreeWord(text){
  const stripped = (text || '').replace(/\bfree\b(?!\s+flicks\b)/gi, ' ').replace(/\s{2,}/g, ' ').trim();
  return stripped ? stripped.charAt(0).toUpperCase() + stripped.slice(1) : stripped;
}

// stop is optional - when a specific stop is given (clicking that stop's own
// pin on a multi-location brand), the popup shows just that stop's place and
// time instead of every stop lumped together, which wouldn't make sense for
// stops at different addresses.
function buildPopup(ev, stop){
  const address = stop ? stop.address : ev.address;
  const neighbourhood = stop ? stop.neighbourhood : ev.location;
  const timeText = stop ? stop.timeWindow : ev.timeWindows.join(' &middot; ');
  const lat = stop ? stop.lat : ev.lat;
  const lng = stop ? stop.lng : ev.lng;
  const directionsQuery = address
    ? encodeURIComponent(address + ', ' + neighbourhood + ', Toronto, ON')
    : lat + ',' + lng;
  return `<div class="popup-cat">${catLabel[ev.cat]}${ev.sponsored ? ' &middot; Sponsored' : ''}</div>
  <div class="popup-brand">${ev.brand}</div>
  <div style="font-size:12.5px;max-width:190px;">${stripFreeWord(ev.what)}</div>
  <div style="font-size:11.5px;color:#6B7280;margin-top:4px;">${timeText} &middot; ${neighbourhood}</div>
  <a class="popup-btn" href="https://www.google.com/maps/search/?api=1&query=${directionsQuery}" target="_blank" rel="noopener">Get directions</a>`;
}

// Listing times are always displayed as Toronto local time, regardless of
// the viewer's own device timezone, since every event happens in Toronto.
const TORONTO_TZ = 'America/Toronto';

function getTimezoneOffsetMs(timeZone, date){
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone, hourCycle: 'h23',
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit',
  });
  const parts = dtf.formatToParts(date).reduce((acc,p) => { acc[p.type] = p.value; return acc; }, {});
  const asUTC = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
  return asUTC - date.getTime();
}

// When a listing has no end time, assume it wraps up at 9pm Toronto time on
// its start date rather than treating it as live indefinitely.
function assumedEnd(start){
  const s = new Date(start);
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: TORONTO_TZ, year:'numeric', month:'2-digit', day:'2-digit',
  }).formatToParts(s).reduce((acc,p) => { acc[p.type] = p.value; return acc; }, {});
  const guess = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day), 21, 0);
  const offset = getTimezoneOffsetMs(TORONTO_TZ, new Date(guess));
  return new Date(guess - offset).toISOString();
}

function statusFromTimes(start, end){
  const now = new Date();
  const s = new Date(start), e = new Date(end || assumedEnd(start));
  if (now < s) return 'soon';
  if (now > e) return 'ended';
  return 'live';
}

function torontoParts(d){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: TORONTO_TZ, hourCycle: 'h23',
    hour: '2-digit', minute: '2-digit',
  }).formatToParts(d).reduce((acc,p) => { acc[p.type] = p.value; return acc; }, {});
  return {hour: Number(parts.hour), minute: Number(parts.minute)};
}

function hasClockTime(d){
  const {hour, minute} = torontoParts(d);
  return hour !== 0 || minute !== 0;
}
function formatDay(d){ return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', timeZone: TORONTO_TZ}); }
function formatClock(d){ return d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone: TORONTO_TZ}).toLowerCase().replace(' ',''); }
function torontoDateKey(d){ return d.toLocaleDateString('en-CA', {timeZone: TORONTO_TZ}); }

// Standard format: "Day, Mon Date[ - Day, Mon Date], startTime - endTime"
// so every listing (single day or spanning several) reads the same way.
function formatTimeRange(start, end){
  const s = new Date(start);
  const sDay = formatDay(s);
  const sHasTime = hasClockTime(s);
  // No end time at all (distinct from a date-only end below) - show just
  // the start rather than filling in a fabricated end time.
  if (!end) return sHasTime ? sDay + ', from ' + formatClock(s) : sDay;
  const rawEnd = new Date(end);
  const eHasTime = hasClockTime(rawEnd);
  // A date-only end that lands exactly at midnight is a half-open boundary
  // (needed so the listing stays live through the whole last day) and
  // represents the end of the PREVIOUS day for display purposes, not the
  // start of a new one.
  const e = eHasTime ? rawEnd : new Date(rawEnd.getTime() - 60000);
  const sameDay = torontoDateKey(s) === torontoDateKey(e);
  const dayPart = sameDay ? sDay : sDay + ' - ' + formatDay(e);
  if (sHasTime && eHasTime) return dayPart + ', ' + formatClock(s) + ' - ' + formatClock(rawEnd);
  if (sHasTime) return dayPart + ', from ' + formatClock(s);
  if (eHasTime) return dayPart + ', until ' + formatClock(rawEnd);
  return dayPart;
}

function groupRows(rows){
  // Rows explicitly linked via group_id group as before (admin-curated,
  // e.g. an intentional multi-stop touring brand). Rows without one only
  // auto-group when brand, location, AND offering (what) all match - so
  // the same brand offering the same thing at the same spot on different
  // dates becomes one event with multiple time windows, but the same
  // brand offering something different (even at the same location) stays
  // split into separate pins/cards.
  const groups = {};
  const order = [];
  rows.forEach(row => {
    const key = row.group_id || ('brand-' + row.brand + '|loc-' + row.neighbourhood + '|what-' + row.what);
    if (!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(row);
  });
  return order.map(key => groups[key].sort((a,b) => new Date(a.start_time) - new Date(b.start_time)));
}

function statusFromWindows(rows){
  // Once the earliest window has started, the whole multi-day event reads
  // as live through to the last window's end, including overnight gaps
  // between individual windows (e.g. a festival that closes each night and
  // reopens the next morning shouldn't flip back to "starting soon").
  const now = new Date();
  const minStart = new Date(Math.min(...rows.map(r => new Date(r.start_time).getTime())));
  const maxEnd = new Date(Math.max(...rows.map(r => new Date(r.end_time || assumedEnd(r.start_time)).getTime())));
  if (now < minStart) return 'soon';
  if (now > maxEnd) return 'ended';
  return 'live';
}

function transformGroup(rows){
  const primary = rows[0];
  // One stop per row: covers both the "same location, several time windows"
  // case (explicit group_id) and the "same brand, different addresses
  // and/or dates" case (grouped by brand name above) with the same shape.
  const stops = rows.map(r => ({
    address: r.address,
    neighbourhood: r.neighbourhood,
    lat: r.lat,
    lng: r.lng,
    timeWindow: formatTimeRange(r.start_time, r.end_time),
  }));
  return {
    id: primary.id,
    brand: primary.brand,
    cat: primary.category,
    location: primary.neighbourhood,
    locations: [...new Set(rows.map(r => r.neighbourhood))],
    address: primary.address,
    lat: primary.lat,
    lng: primary.lng,
    stops,
    what: primary.what,
    timeWindows: rows.map(r => formatTimeRange(r.start_time, r.end_time)),
    startTime: primary.start_time,
    sponsored: primary.sponsored,
    status: statusFromWindows(rows),
  };
}

function matchesStatusFilter(ev){
  if (activeStatus === 'all') return true;
  if (activeStatus === 'live') return ev.status === 'live';
  const start = new Date(ev.startTime).getTime();
  const day = 24 * 60 * 60 * 1000;
  if (activeStatus === 'next3'){
    return start <= Date.now() + 3 * day;
  }
  if (activeStatus === 'nextweek'){
    return start > Date.now() + 3 * day && start <= Date.now() + 7 * day;
  }
  if (activeStatus === 'nextmonth'){
    return start > Date.now() + 7 * day;
  }
  return true;
}

// Pins render at their real geocoded lat/lng always, with no spread-apart
// logic - a couple of attempts at nudging overlapping pins into a small
// ring introduced zoom-timing edge cases that occasionally sent pins far
// from their true position. Toronto Happy Hour's map (a similar Toronto
// listings map) takes the same approach: overlapping pins just render on
// top of each other, and zooming in naturally separates them.
function renderMarkers(){
  markers.forEach(m => m.remove());
  markers = [];
  // Pins only ever show currently-live events, regardless of which status
  // chip is active - the status chips still drive next3/nextweek filtering
  // for anything that reads matchesStatusFilter elsewhere, but the map
  // itself is meant to answer "what can I go to right now."
  const filtered = events.filter(ev =>
    ev.status === 'live' &&
    (activeCats.length===0 || activeCats.includes(ev.cat)) &&
    (activeLocations.length===0 || ev.locations.some(loc => activeLocations.includes(loc)))
  );
  // A brand with several stops (different addresses and/or dates) is one
  // event but gets one pin per stop, since each stop is a real, distinct
  // place someone can go. When a location filter is active, only stops in
  // that location get a pin - a brand touring several neighbourhoods
  // matches the filter as a whole, but a pin in a neighbourhood the user
  // didn't select would be confusing.
  filtered.forEach(ev=>{
    const stopsToShow = activeLocations.length === 0
      ? ev.stops
      : ev.stops.filter(s => activeLocations.includes(s.neighbourhood));
    stopsToShow.forEach(stop => {
      const popup = new maplibregl.Popup({offset:22}).setHTML(buildPopup(ev, ev.stops.length > 1 ? stop : undefined));
      const marker = new maplibregl.Marker({element: pinElement(ev), anchor:'center'})
        .setLngLat([stop.lng, stop.lat])
        .setPopup(popup)
        .addTo(map);
      markers.push(marker);
    });
  });
}

function renderStatusFilters(){
  const opts = [
    {id:'all', label:'All'},
    {id:'live', label:'Live now', pulse:true},
    {id:'next3', label:'Next 3 days'},
    {id:'nextweek', label:'Next week'},
    {id:'nextmonth', label:'Next month+'},
  ];
  const wrap = document.getElementById('statusFilters');
  wrap.innerHTML = '';
  opts.forEach(o=>{
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (activeStatus===o.id ? ' active' : '');
    chip.innerHTML = (o.pulse ? '<span class="pulse"></span>' : '') + o.label;
    chip.onclick = ()=>{ activeStatus = o.id; renderStatusFilters(); renderMarkers(); };
    wrap.appendChild(chip);
  });
}

function renderCatFilters(){
  const wrap = document.getElementById('catFilters');
  wrap.innerHTML = '';
  categories.forEach(c=>{
    const isAll = c.id === 'all';
    const isActive = isAll ? activeCats.length === 0 : activeCats.includes(c.id);
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (isActive ? ' active' : '');
    chip.style.background = isActive ? c.color : '#fff';
    chip.textContent = c.label;
    chip.onclick = ()=>{
      if (isAll){
        activeCats = [];
      } else if (activeCats.includes(c.id)){
        activeCats = activeCats.filter(id => id !== c.id);
      } else {
        activeCats = [...activeCats, c.id];
      }
      renderCatFilters();
      renderMarkers();
    };
    wrap.appendChild(chip);
  });
}

function renderLocationFilters(){
  const wrap = document.getElementById('locationFilters');
  wrap.innerHTML = '';
  locationOptions.forEach(n=>{
    const isAll = n === 'All locations';
    const isActive = isAll ? activeLocations.length === 0 : activeLocations.includes(n);
    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (isActive ? ' active' : '');
    chip.textContent = n;
    chip.onclick = ()=>{
      if (isAll){
        activeLocations = [];
      } else if (activeLocations.includes(n)){
        activeLocations = activeLocations.filter(l => l !== n);
      } else {
        activeLocations = [...activeLocations, n];
      }
      renderLocationFilters();
      renderMarkers();
    };
    wrap.appendChild(chip);
  });
}

function renderLegend(){
  const wrap = document.getElementById('mapLegend');
  const itemsHtml = categories.filter(c => c.id !== 'all').map(c =>
      `<div class="legend-item"><span class="legend-dot" style="background:${c.color}"></span>${c.label}</div>`
    ).join('') +
    `<div class="legend-item"><span class="legend-dot" style="background:var(--amber)"></span>Sponsored</div>`;
  wrap.innerHTML = `<div class="legend-title" id="legendToggle">Categories<button class="legend-toggle" aria-label="Toggle legend">&#9662;</button></div>` +
    `<div class="legend-items" id="legendItems">${itemsHtml}</div>`;
  // Expanded by default everywhere, including mobile; the toggle only
  // collapses it once the user taps it themselves.
  document.getElementById('legendToggle').onclick = () => wrap.classList.toggle('collapsed');
}

async function loadListings(){
  const { data, error } = await sb.from('listings').select('*').eq('moderation_status', 'approved');
  if (error) return;
  events = groupRows(data).map(transformGroup).filter(ev => ev.status !== 'ended');
  document.getElementById('liveCount').textContent = events.filter(e=>e.status==='live').length;
  renderMarkers();
}

renderStatusFilters();
renderCatFilters();
renderLocationFilters();
renderLegend();
loadListings();
</script>
