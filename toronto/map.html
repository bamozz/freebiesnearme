<style>
  :root{
    --paper:#FEFCF6; --paper-alt:#F5F2E8; --ink:#151B21; --muted:#6B7280;
    --line:#E4E8E5; --teal:#0E9C82; --teal-dim:#E3F5F0;
    --amber:#F0A430; --amber-dim:#FCEED8; --coral:#EF5B4E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  a{color:inherit;}

  nav{
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,0.92);backdrop-filter:blur(6px);
    z-index:500;flex-shrink:0;
  }
  .nav-inner{
    max-width:1220px;margin:0 auto;padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;row-gap:10px;
  }
  .logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;text-decoration:none;color:var(--ink);white-space:nowrap;}
  .nav-links{display:flex;gap:26px;font-size:14px;font-weight:600;color:var(--muted);}
  .nav-links a{text-decoration:none;color:inherit;}
  .nav-links .on{color:var(--ink);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .btn-solid{
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
    padding:9px 16px;border-radius:20px;cursor:pointer;white-space:nowrap;
    text-decoration:none;
  }
  .bottom-tabbar{display:none;}
  @media (max-width:760px){
    .logo{font-size:17px;}
    .nav-links{display:none;}
    .bottom-tabbar{
      display:flex;order:1;flex-shrink:0;z-index:600;
      background:rgba(255,255,255,0.96);backdrop-filter:blur(6px);
      border-top:1px solid var(--line);
      padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    }
    .tab-item{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
      font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;
    }
    .tab-item.on{color:var(--ink);}
    .tab-icon{font-size:18px;line-height:1;display:flex;}
    .tab-icon svg{width:1em;height:1em;}
  }

  .map-wrap{position:relative;flex:1;min-height:0;}
  #map{position:absolute;inset:0;}

  .map-badge{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:10;
    background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;
    display:flex;align-items:center;gap:7px;
    box-shadow:0 2px 10px rgba(21,27,33,0.08);
  }
  .map-badge .pulse{width:6px;height:6px;border-radius:50%;background:var(--teal);}

  .maplibregl-popup-content{border-radius:10px;border:1px solid var(--line);font-family:'Inter',sans-serif;padding:12px 14px;}
  .popup-cat{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}
  .popup-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin:3px 0 4px;}
  .popup-btn{
    margin-top:8px;display:inline-block;font-size:11.5px;font-weight:700;
    background:var(--ink);color:#fff;padding:6px 11px;border-radius:14px;text-decoration:none;
  }
  .pin{
    width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;position:relative;
    border:2px solid #fff;box-shadow:0 1px 5px rgba(21,27,33,0.35);cursor:pointer;
  }
  .pin::before{
    content:"";position:absolute;top:4px;left:4px;width:4px;height:4px;
    border-radius:50%;background:rgba(255,255,255,0.75);
  }
  .pin.sponsored{background:var(--amber) !important;}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ulmmxjsvlzmxdvstabwa.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsbW14anN2bHpteGR2c3RhYndhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMjcyNDYsImV4cCI6MjEwMDYwMzI0Nn0.LR3Sbk_faC_nARJmv_xp4LcopfoWkD9Jbdco9XhecmI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const catColor = {food:'#EF5B4E', beauty:'#D6579A', fashion:'#3E6FA8', tech:'#0E9C82', wellness:'#8467C9'};
const catLabel = {food:'Food & Drink', beauty:'Beauty', fashion:'Fashion', tech:'Tech', wellness:'Wellness'};

const map = new maplibregl.Map({
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [-79.3832, 43.6532],
  zoom: 12.2,
  minZoom: 10,
  maxBounds: [[-79.75, 43.53], [-79.05, 43.90]],
  container: 'map',
});
map.addControl(new maplibregl.NavigationControl(), 'top-left');
requestAnimationFrame(()=>map.resize());
window.addEventListener('load', ()=>map.resize());
window.addEventListener('resize', ()=>map.resize());

function pinElement(ev){
  const color = ev.sponsored ? '#F0A430' : catColor[ev.cat];
  const el = document.createElement('div');
  el.className = 'pin' + (ev.sponsored ? ' sponsored' : '');
  el.style.background = color;
  return el;
}

function buildPopup(ev){
  const directionsQuery = ev.address
    ? encodeURIComponent(ev.address + ', ' + ev.location + ', Toronto, ON')
    : ev.lat + ',' + ev.lng;
  return `<div class="popup-cat">${catLabel[ev.cat]}${ev.sponsored ? ' &middot; Sponsored' : ''}</div>
  <div class="popup-brand">${ev.brand}</div>
  <div style="font-size:12.5px;max-width:190px;">${ev.what}</div>
  <div style="font-size:11.5px;color:#6B7280;margin-top:4px;">${ev.time} &middot; ${ev.location}</div>
  <a class="popup-btn" href="https://www.google.com/maps/search/?api=1&query=${directionsQuery}" target="_blank" rel="noopener">Get directions</a>`;
}

function statusFromTimes(start, end){
  const now = new Date();
  if (!end) return now < new Date(start) ? 'soon' : 'live';
  const s = new Date(start), e = new Date(end);
  if (now < s) return 'soon';
  if (now > e) return 'ended';
  return 'live';
}

function hasClockTime(d){ return d.getHours() !== 0 || d.getMinutes() !== 0; }
function formatDay(d){ return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}).replace(',', ''); }
function formatClock(d){ return d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}).toLowerCase().replace(' ',''); }

function formatTimeRange(start, end){
  const s = new Date(start);
  const sDay = formatDay(s);
  const sHasTime = hasClockTime(s);
  if (!end) return sHasTime ? sDay + ', from ' + formatClock(s) : sDay;
  const e = new Date(end);
  const eHasTime = hasClockTime(e);
  const sameDay = s.toDateString() === e.toDateString();
  if (sameDay){
    if (sHasTime && eHasTime) return sDay + ', ' + formatClock(s) + ' to ' + formatClock(e);
    if (sHasTime) return sDay + ', from ' + formatClock(s);
    return sDay;
  }
  const eDay = formatDay(e);
  const startPart = sHasTime ? sDay + ' ' + formatClock(s) : sDay;
  const endPart = eHasTime ? eDay + ' ' + formatClock(e) : eDay;
  return startPart + ' - ' + endPart;
}

function transformRow(row){
  return {
    id: row.id,
    brand: row.brand,
    cat: row.category,
    location: row.neighbourhood,
    address: row.address,
    lat: row.lat,
    lng: row.lng,
    what: row.what,
    time: formatTimeRange(row.start_time, row.end_time),
    sponsored: row.sponsored,
    status: statusFromTimes(row.start_time, row.end_time),
  };
}

async function loadListings(){
  const { data, error } = await sb.from('listings').select('*').eq('moderation_status', 'approved');
  if (error) return;
  const events = data.map(transformRow);
  document.getElementById('liveCount').textContent = events.filter(e=>e.status==='live').length;
  events.forEach(ev=>{
    const popup = new maplibregl.Popup({offset:22}).setHTML(buildPopup(ev));
    new maplibregl.Marker({element: pinElement(ev), anchor:'bottom'})
      .setLngLat([ev.lng, ev.lat])
      .setPopup(popup)
      .addTo(map);
  });
}

loadListings();
</script>
